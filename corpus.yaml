# The card-authentication workspace: what to ingest, how to read it, what to grade.
#
# One file so the CLI and the UI build the same thing. Point `fixture` at a recorded
# extraction to build offline; remove it to call the model.
use_case: card_authentication
schema: schemas/core.ontology.yaml
extend: schemas/card_auth.ontology.yaml
profile: profiles/card_auth.telemetry.yaml
fixture: fixtures/card_auth.extraction.json
factors: catalogs/voice.factors.yaml

# A human reading of the same source, to score the graph against. The measurement
# everything else rests on: a fact the pipeline invents becomes a test someone is failed
# for, and no internal check detects an error that was in the source reading itself.
annotation: annotations/card_auth.gold.yaml

# Every tunable, with the defaults written out. Picked up automatically when it sits
# beside this file; name another path here to point somewhere else.
settings: metric.yaml

# A named bundle from the factor catalogue, or leave it out for the whole catalogue.
# factor_profile: smoke

# Bases supplied by hand rather than mined from the graph — real cases to harden
# against, whose answer is the ground truth whether or not the graph agrees yet.
# seeds: catalogs/card_auth.seeds.yaml

documents:
  - path: grounding/07-card-authentication-policy.md
    policy_version: poc-1
    effective_date: "2026-01-15"
    # This file carries the policy *and* this repository's own notes about why it is a
    # good first corpus — including a table of which ingestion problem each section
    # exercises. Those notes are written in the same imperative voice as the policy, so
    # the extractor read eight Rules out of them: well-formed, correctly cited, governing
    # nothing, and one human question each. What is policy is a fact about the document,
    # so it is stated here rather than left for a model to infer.
    skip_sections:
      - "Why this document is a good phase-1 target"

traces:
  - fixtures/card_auth.trace.json
  - grounding/03-otel-trace-sample-galileo.json
